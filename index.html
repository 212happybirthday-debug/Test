<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noob Obfuscator</title>
    <style>
        :root {
            --bg-color: #0d0d0d; /* 黒 */
            --text-color: #ffffff; /* 白 */
            --accent-yellow: #f1c40f; /* 黄色 */
            --accent-blue: #3498db; /* 青 */
            --accent-green: #2ecc71; /* 緑 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: var(--accent-yellow);
            text-shadow: 2px 2px 10px rgba(241, 196, 15, 0.5);
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .container {
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-label {
            color: var(--accent-blue);
            font-weight: bold;
            margin-bottom: 5px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #1a1a1a;
            color: var(--accent-green);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        textarea::placeholder {
            color: #555;
        }

        .btn-container {
            display: flex;
            justify-content: center;
        }

        #obfu-btn {
            background-color: var(--accent-yellow);
            color: var(--bg-color);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }

        #obfu-btn:hover {
            transform: scale(1.05);
            background-color: var(--accent-green);
            color: white;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.6);
        }

        #obfu-btn:active {
            transform: scale(0.95);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #444;
        }
    </style>
</head>
<body>

    <h1>Noob Obfuscator</h1>

    <div class="container">
        <div>
            <div class="editor-label">INPUT LUA CODE:</div>
            <textarea id="inputCode" placeholder="-- Paste your Lua script here..."></textarea>
        </div>

        <div class="btn-container">
            <button id="obfu-btn">Obfu</button>
        </div>

        <div>
            <div class="editor-label">OBFUSCATED RESULT:</div>
            <textarea id="outputCode" readonly placeholder="Obfuscated code will appear here..."></textarea>
        </div>
    </div>

    <div class="footer">
        Powered by AAN | For Master Kyle
    </div>

    <script>
        document.getElementById('obfu-btn').addEventListener('click', function() {
            const input = document.getElementById('inputCode').value;
            if (!input.trim()) {
                alert("コードを入力しろよ、マスター。");
                return;
            }

            // 簡易的な難読化シミュレーション (Luraph風の見た目にする)
            const obfuscated = generateObfuscation(input);
            document.getElementById('outputCode').value = obfuscated;
        });

        function generateObfuscation(code) {
            // 文字列をバイトコードっぽく変換したり、ダミー関数で包む処理
            const header = "--[[ Noob Obfuscator v1.0 ]]\n";
            const randomVar = "Lulu_" + Math.random().toString(36).substring(7);
            const encoded = btoa(code).split('').map(c => "\\" + c.charCodeAt(0)).join('');
            
            return `${header}local ${randomVar} = function(str) return (str:gsub('\\\\%d+', function(c) return string.char(tonumber(c:sub(2))) end)) end\nloadstring(${randomVar}("${encoded}"))()`;
        }
    </script>

</body>
</html>
